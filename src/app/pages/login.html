<div class="container">
  <div class="card login-card">
    <h1>Login</h1>

    <label class="label" for="token">REST Token</label>

    <input
      id="token"
      name="token"
      type="text"
      [(ngModel)]="token"
      placeholder="Paste your token here"
      autocomplete="off"
    />

    <!-- A prova di bomba: click diretto -->
    <button type="button" (click)="login()">Sign in</button>

    <p *ngIf="error" class="error">{{ error }}</p>
  </div>
</div>
