<div class="container">
  <div class="card">
    <h2>Users</h2>

    <!-- CREATE USER (UI) -->
    <div class="card" style="margin-bottom: 16px;">
      <h3>Create new user</h3>

      <div style="display:flex; gap:12px; margin-bottom:10px;">
        <input type="text" placeholder="Full name" [(ngModel)]="newName" style="flex:1;" />
        <input type="email" placeholder="Email" [(ngModel)]="newEmail" style="flex:1;" />
      </div>

      <div style="display:flex; gap:12px; margin-bottom:10px;">
        <select [(ngModel)]="newGender" style="flex:1;">
          <option value="male">male</option>
          <option value="female">female</option>
        </select>

        <select [(ngModel)]="newStatus" style="flex:1;">
          <option value="active">active</option>
          <option value="inactive">inactive</option>
        </select>
      </div>

      <button type="button">Create user</button>
    </div>

    <!-- STATUS -->
    <p *ngIf="loading">Loading users...</p>
    <p *ngIf="!loading && error" class="error">{{ error }}</p>

    <!-- LIST -->
    <div *ngIf="!loading && !error">
      <p *ngIf="users.length === 0">Nessun utente trovato.</p>

      <div class="users-grid" *ngIf="users.length > 0">
        <div class="user-card" *ngFor="let u of users">
          <div style="font-weight:600;">{{ u.name }}</div>
          <div style="opacity:.85;">{{ u.email }}</div>
          <div style="opacity:.85;">{{ u.gender }} • {{ u.status }}</div>

          <div style="margin-top:10px;">
            <button type="button">Delete</button>
          </div>
        </div>
      </div>
